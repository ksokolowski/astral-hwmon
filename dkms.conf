PACKAGE_NAME="astral-hwmon"
PACKAGE_VERSION="0.3.1"
BUILT_MODULE_NAME[0]="astral-hwmon"
BUILT_MODULE_LOCATION[0]="driver"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hwmon"
# kbuild compares "$CC --version" against the kernel's own CONFIG_CC_VERSION_TEXT
# as a plain string. On Debian and Ubuntu the kernel records the triplet name -
# x86_64-linux-gnu-gcc - while gcc reports itself as plain gcc, so the build
# warns that the compiler differs when it is byte-identical: same package, same
# version, different argv[0]. Use the name the kernel itself recorded.
#
# Guarded on purpose, because AUTOINSTALL re-runs this unattended on every
# kernel upgrade: an empty CC= would override kbuild's default with nothing and
# break the build rather than warn, so the name is used only when a program by
# that name actually exists. On a distro whose .config records plain "gcc" this
# resolves to gcc and changes nothing.
#
# Duplicated from the module target in the top-level Makefile, which DKMS cannot
# use: dkms-install copies only driver/ and this file into /usr/src.
ASTRAL_CC=""
if [ -r "${kernel_source_dir}/.config" ]; then
    _astral_cc="$(sed -n 's/^CONFIG_CC_VERSION_TEXT="\([^ ]*\).*/\1/p' "${kernel_source_dir}/.config" 2>/dev/null)"
    if [ -n "${_astral_cc}" ] && command -v "${_astral_cc}" >/dev/null 2>&1; then
        ASTRAL_CC="CC=${_astral_cc}"
    fi
fi

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/driver ${ASTRAL_CC} modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/driver clean"
AUTOINSTALL="yes"
