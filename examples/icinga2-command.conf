/* Example only. Not installed.
 *
 * astral-guard already speaks the monitoring-plugin exit-code convention, so
 * no wrapper script is needed: 0 OK, 1 WARNING, 2 CRITICAL, 3 UNKNOWN.
 */

object CheckCommand "astral_guard" {
  command = [ "/usr/local/bin/astral-guard" ]

  arguments = {
    "--samples" = {
      value = "$astral_guard_samples$"
      description = "Samples per run; a finding must hold in all of them"
    }
  }

  vars.astral_guard_samples = 5
}

/* Example service, for a host with the card in it:
 *
 * apply Service "12vhpwr" {
 *   check_command = "astral_guard"
 *   check_interval = 5m
 *   assign where host.vars.has_astral_gpu
 * }
 */
